name: Build SDM710 Kernel (Sirius/小米8 SE) with KSU
on:
  workflow_dispatch:
  push:
    branches: [ lineage-23.2-ksu ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      # 不再编译内核，直接下载你仓库发布的 成品Image.gz-dtb + 原厂boot
      - name: 1. 下载已编译好的内核镜像 + 原厂boot.img
        run: |
          wget https://github.com/Rocky7842/android_kernel_xiaomi_sdm710/releases/download/lineage-23.2/Image.gz-dtb -O Image.gz-dtb
          wget https://github.com/Rocky7842/android_kernel_xiaomi_sdm710/releases/download/lineage-23.2/stock_boot.img -O stock_boot.img

      - name: 2. 下载KernelSU官方boot-patcher工具注入
        run: |
          wget https://github.com/tiann/KernelSU/releases/latest/download/boot-patcher -O boot-patcher
          chmod +x boot-patcher
          ./boot-patcher stock_boot.img Image.gz-dtb KSU_sirius_boot.img

      - name: 3. 上传成品KSU boot.img
        uses: actions/upload-artifact@v4
        with:
          name: KSU‑Sirius‑Boot‑Image
          path: KSU_sirius_boot.img
