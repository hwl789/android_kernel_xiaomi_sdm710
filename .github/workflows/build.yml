name: 小米8SE SDM710 内核编译集成KernelSU0.9.5
on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: 拉取内核源码
        uses: actions/checkout@v4
        with:
          repository: Rocky7842/android_kernel_xiaomi_sdm710
          ref: lineage-23.0
          fetch-depth: 1

      - name: 安装编译依赖
        run: |
          sudo apt update -y
          sudo apt install -y build-essential libelf-dev bc bison flex libssl-dev \
          gcc-aarch64-linux-gnu g++-aarch64-linux-gnu lzop liblz4-tool git

      - name: 自动集成 KernelSU 0.9.5
        run: |
          curl -LSs https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh | bash -s v0.9.5

      - name: 写入KSU核心配置
        run: |
          echo -e "\nCONFIG_KSU=y
CONFIG_KSU_NO_KPROBES=y
CONFIG_KALLSYMS=y
CONFIG_KALLSYMS_ALL=y
CONFIG_MODULES=y
CONFIG_MODULE_UNLOAD=y
# CONFIG_KPROBES is not set" >> arch/arm64/configs/xiaomi/sirius.config

      - name: 注入init初始化代码
        run: |
          sed -i '/#include <linux\/init.h>/a #include <linux\/ksu.h>' init/main.c
          sed -i '/do_basic_setup();/a \    ksu_init();' init/main.c

      - name: 打入fs/stat.c补丁
        run: |
          sed -i '/EXPORT_SYMBOL(vfs_fstat);/a \
#ifdef CONFIG_KSU
extern int ksu_handle_stat(int *dfd, const char __user *filename, int flags, unsigned int mask);
#endif' fs/stat.c

      - name: 打入fs/open.c补丁
        run: |
          sed -i '/long do_sys_open(int dfd, const char __user *filename, int flags, umode_t mode)/a \
#ifdef CONFIG_KSU
extern int ksu_handle_open(int *dfd, const char __user *filename, int *flags);
#endif' fs/open.c

      - name: 打入fs/exec.c补丁
        run: |
          sed -i '/int do_execveat_common(int fd, struct filename *filename,/a \
#ifdef CONFIG_KSU
extern int ksu_handle_exec(struct filename **filename);
#endif' fs/exec.c

      - name: 打入fs/read_write.c补丁
        run: |
          sed -i '/ssize_t vfs_read(struct file *file, char __user *buf, size_t count, loff_t *pos)/a \
#ifdef CONFIG_KSU
extern int ksu_handle_read_write(struct file *file, char __user *buf, size_t *count, loff_t *pos);
#endif' fs/read_write.c

      - name: 打入安全模式input补丁
        run: |
          sed -i '/void input_handle_event(struct input_dev *dev,/a \
#ifdef CONFIG_KSU
extern void ksu_handle_input_event(struct input_dev *dev, unsigned int type, unsigned int code, int value);
#endif' drivers/input/input.c
          sed -i '/spin_unlock_irqrestore(&dev->event_lock, flags);/i \
#ifdef CONFIG_KSU
               ksu_handle_input_event(dev, type, code, value);
#endif' drivers/input/input.c

      - name: 打入devpts修复pm命令补丁
        run: |
          sed -i '/static struct dentry \*devpts_get_inode/a \
#ifdef CONFIG_KSU
extern int ksu_handle_devpts(struct inode *inode);
#endif' fs/devpts/inode.c
          sed -i '/return NULL;/i ksu_handle_devpts(dentry->d_inode);' fs/devpts/inode.c

      - name: 打入umount模块卸载补丁
        run: |
          sed -i '/static inline bool may_mount(void)/,/#endif/a \
static int can_umount(const struct path *path, int flags)
{
    struct mount *mnt = real_mount(path->mnt);
    if (flags & ~(MNT_FORCE | MNT_DETACH))
        return -EINVAL;
    if (!may_mount())
        return -EPERM;
    if (path->dentry != path->mnt->mnt_root)
        return -EINVAL;
    if (!mnt->mnt_ns)
        return -EINVAL;
    return 0;
}
#ifdef CONFIG_KSU
extern int ksu_handle_umount(struct path *path, int *flags);
#endif' fs/namespace.c

      - name: 载入设备配置
        run: |
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- sirius_defconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

      - name: 正式编译内核
        run: |
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc)

      - name: 导出内核镜像
        run: |
          cp arch/arm64/boot/Image.gz-dtb ksu-kernel.img

      - name: 上传编译成品
        uses: actions/upload-artifact@v4
        with:
          name: 小米8SE-KSU0.9.5内核镜像
          path: ksu-kernel.img
