name: Rocky7842 SDM710 Kernel + KernelSU 0.9.5
on:
  workflow_dispatch:
  push:
    branches: [ lineage-23.0 ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: lineage-23.0
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt update && sudo apt upgrade -y
          sudo apt install -y build-essential libssl-dev libelf-dev bc bison flex cpio zip unzip git libc6-dev-i386
          git config --global credential.helper cache
          git config --global http.sslVerify false

      # 改用 wget 直接下载 GCC 10 工具链压缩包，绕过 git 网络问题
      - name: Download GCC 10 Toolchain
        run: |
          wget -O gcc10.tar.xz https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-10.0.0_r47.tar.gz
          tar -xzf gcc10.tar.xz -C toolchain --strip-components=1 || \
          # 备用下载源
          wget -O gcc10.tar.gz https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-10/archive/refs/heads/lineage-20.0.tar.gz && \
          mkdir -p toolchain && tar -xzf gcc10.tar.gz -C toolchain --strip-components=1

      # 验证工具链路径和二进制文件
      - name: Verify Toolchain
        run: |
          export PATH=$GITHUB_WORKSPACE/toolchain/bin:$PATH
          ls -la $GITHUB_WORKSPACE/toolchain/bin/
          which aarch64-linux-android-gcc || echo "编译器未找到，路径问题"
          aarch64-linux-android-gcc --version || echo "编译器无法执行"

      - name: Inject KernelSU Flags
        run: |
          cd $GITHUB_WORKSPACE
          COM=arch/arm64/configs/xiaomi/sdm710-common.config
          DEV=arch/arm64/configs/xiaomi/pyxis.config

          sed -i 's/CONFIG_NR_CPUS=.*/CONFIG_NR_CPUS=8/' $COM
          sed -i 's/CONFIG_NR_CPUS=.*/CONFIG_NR_CPUS=8/' $DEV

          echo "CONFIG_KPROBES=y" >> $COM
          echo "CONFIG_KALLSYMS_ALL=y" >> $COM
          echo "CONFIG_MODULES=y" >> $COM
          echo "CONFIG_MODULE_UNLOAD=y" >> $COM
          echo "CONFIG_KSU=y" >> $COM

          echo "CONFIG_KPROBES=y" >> $DEV
          echo "CONFIG_KALLSYMS_ALL=y" >> $DEV
          echo "CONFIG_MODULES=y" >> $DEV
          echo "CONFIG_MODULE_UNLOAD=y" >> $DEV
          echo "CONFIG_KSU=y" >> $DEV

      - name: Integrate KernelSU 0.9.5
        run: |
          cd $GITHUB_WORKSPACE
          curl -LSs https://raw.githubusercontent.com/tiann/KernelSU/v0.9.5/kernel/setup.sh | bash -s v0.9.5

      - name: Generate and Build Config
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-android-
        run: |
          cd $GITHUB_WORKSPACE
          export PATH=$GITHUB_WORKSPACE/toolchain/bin:$PATH
          
          # 合并配置文件
          cat arch/arm64/configs/xiaomi/sdm710-common.config arch/arm64/configs/xiaomi/pyxis.config > arch/arm64/configs/pyxis_defconfig
          
          # 生成 .config
          make pyxis_defconfig
          
          # 编译内核（屏蔽非关键警告）
          make -j$(nproc) KCFLAGS=-w

      - name: Move Kernel Image
        run: |
          cp arch/arm64/boot/Image.gz-dtb boot.img

      - name: Upload Boot Image
        uses: actions/upload-artifact@v4
        with:
          name: Rocky7842-Pyxis-KSU095-Boot
          path: boot.img
