name: SDM710 Kernel + KernelSU 0.9.5

on:
  workflow_dispatch:
  push:
    branches: [ lineage-23.0 ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: lineage-23.0
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt update -y
          sudo apt install -y \
            build-essential \
            libssl-dev \
            libelf-dev \
            bc bison flex \
            python3 zip unzip \
            make gcc g++ cpio

      - name: Clone official LineageOS GCC 4.9 toolchain
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git toolchain

      - name: Apply KernelSU configs
        run: |
          cd $GITHUB_WORKSPACE
          COMMON=arch/arm64/configs/xiaomi/sdm710-common.config
          DEV_CFG=arch/arm64/configs/xiaomi/pyxis.config
          
          sed -i 's/CONFIG_NR_CPUS=.*/CONFIG_NR_CPUS=8/' $COMMON
          sed -i 's/CONFIG_NR_CPUS=.*/CONFIG_NR_CPUS=8/' $DEV_CFG

          echo "CONFIG_KPROBES=y" >> $COMMON
          echo "CONFIG_KALLSYMS_ALL=y" >> $COMMON
          echo "CONFIG_MODULES=y" >> $COMMON
          echo "CONFIG_MODULE_UNLOAD=y" >> $COMMON
          echo "CONFIG_KSU=y" >> $COMMON

          echo "CONFIG_KPROBES=y" >> $DEV_CFG
          echo "CONFIG_KALLSYMS_ALL=y" >> $DEV_CFG
          echo "CONFIG_MODULES=y" >> $DEV_CFG
          echo "CONFIG_MODULE_UNLOAD=y" >> $DEV_CFG
          echo "CONFIG_KSU=y" >> $DEV_CFG

      - name: Integrate KernelSU 0.9.5
        run: |
          cd $GITHUB_WORKSPACE
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/v0.9.5/kernel/setup.sh" | bash -s v0.9.5

      - name: Build kernel
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-android-
        run: |
          cd $GITHUB_WORKSPACE
          export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"
          make pyxis_defconfig
          make -j$(nproc)

      - name: Prepare boot.img
        run: |
          cp $GITHUB_WORKSPACE/arch/arm64/boot/Image.gz-dtb $GITHUB_WORKSPACE/boot.img

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 小米8SE-pyxis-KSU095-boot
          path: boot.img
        
