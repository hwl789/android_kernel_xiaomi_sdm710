name: Rocky7842 SDM710 Kernel + KernelSU 0.9.5
on:
  workflow_dispatch:
  push:
    branches: [ lineage-23.0 ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: lineage-23.0
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt update && sudo apt upgrade -y
          sudo apt install -y build-essential libssl-dev libelf-dev bc bison flex cpio zip unzip git

      # 替换为 GCC 11 工具链（满足内核版本要求）
      - name: Clone GCC 11 Toolchain
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-11.git toolchain

      - name: Inject KernelSU Flags
        run: |
          cd $GITHUB_WORKSPACE
          COM=arch/arm64/configs/xiaomi/sdm710-common.config
          DEV=arch/arm64/configs/xiaomi/pyxis.config

          sed -i 's/CONFIG_NR_CPUS=.*/CONFIG_NR_CPUS=8/' $COM
          sed -i 's/CONFIG_NR_CPUS=.*/CONFIG_NR_CPUS=8/' $DEV

          echo "CONFIG_KPROBES=y" >> $COM
          echo "CONFIG_KALLSYMS_ALL=y" >> $COM
          echo "CONFIG_MODULES=y" >> $COM
          echo "CONFIG_MODULE_UNLOAD=y" >> $COM
          echo "CONFIG_KSU=y" >> $COM

          echo "CONFIG_KPROBES=y" >> $DEV
          echo "CONFIG_KALLSYMS_ALL=y" >> $DEV
          echo "CONFIG_MODULES=y" >> $DEV
          echo "CONFIG_MODULE_UNLOAD=y" >> $DEV
          echo "CONFIG_KSU=y" >> $DEV

      - name: Integrate KernelSU 0.9.5
        run: |
          cd $GITHUB_WORKSPACE
          curl -LSs https://raw.githubusercontent.com/tiann/KernelSU/v0.9.5/kernel/setup.sh | bash -s v0.9.5

      - name: Generate and Build Config
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-android-
        run: |
          cd $GITHUB_WORKSPACE
          export PATH=$GITHUB_WORKSPACE/toolchain/bin:$PATH
          
          # 合并配置文件
          cat arch/arm64/configs/xiaomi/sdm710-common.config arch/arm64/configs/xiaomi/pyxis.config > arch/arm64/configs/pyxis_defconfig
          
          # 生成 .config
          make pyxis_defconfig
          
          # 编译内核
          make -j$(nproc)

      - name: Move Kernel Image
        run: |
          cp arch/arm64/boot/Image.gz-dtb boot.img

      - name: Upload Boot Image
        uses: actions/upload-artifact@v4
        with:
          name: Rocky7842-Pyxis-KSU095-Boot
          path: boot.img
