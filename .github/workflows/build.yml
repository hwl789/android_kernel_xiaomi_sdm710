name: Build SDM710 Kernel with KernelSU 0.9.5

on:
  push:
    branches: [ lineage-23.0 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lineage-23.0

      - name: Install Dependencies
        run: |
          sudo apt update -y
          sudo apt install -y git ccache build-essential libssl-dev libelf-dev bc bison flex python3

      - name: Clone Toolchain
        run: |
          git clone --depth=1 https://github.com/mervin16/aarch64-linux-android-4.9 toolchain

      - name: Enable KPROBE & KALLSYMS
        run: |
          sed -i 's/# CONFIG_KPROBES is not set/CONFIG_KPROBES=y/' arch/arm64/configs/sdm710_defconfig
          sed -i 's/# CONFIG_KALLSYMS_ALL is not set/CONFIG_KALLSYMS_ALL=y/' arch/arm64/configs/sdm710_defconfig
          sed -i 's/# CONFIG_MODULES is not set/CONFIG_MODULES=y/' arch/arm64/configs/sdm710_defconfig

      - name: Integrate KernelSU 0.9.5 (Kprobe mode)
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/v0.9.5/kernel/setup.sh" | bash -s v0.9.5

      - name: Build Kernel
        env:
          PATH: ${{ github.workspace }}/toolchain/bin:$PATH
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-android-
        run: |
          make sdm710_defconfig
          make -j$(nproc)

      - name: Extract boot.img
        run: |
          cp out/arch/arm64/boot/Image.gz-dtb ${{ github.workspace }}/boot.img

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-boot-kernelsu095
          path: boot.img

