name: Rocky7842 SDM710 (Mi8SE/sirius) + KernelSU 0.9.5
on:
  workflow_dispatch:
  push:
    branches: [ lineage-23.0 ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: Rocky7842/android_kernel_xiaomi_sdm710
          ref: lineage-23.0
          fetch-depth: 1

      - name: Install ALL Build Dependencies
        run: |
          sudo apt update && sudo apt upgrade -y
          sudo apt install -y \
            build-essential libssl-dev libelf-dev bc bison flex cpio zip unzip git libc6-dev-i386 \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            liblz4-tool lzop openssl

      - name: 1. 合并小米8 SE配置 + 修复NR_CPUS
        run: |
          cd $GITHUB_WORKSPACE
          # 关键：合并sdm710通用配置 + sirius专属配置
          COM=arch/arm64/configs/xiaomi/sdm710-common.config
          DEV=arch/arm64/configs/xiaomi/sirius.config
          
          ./scripts/kconfig/merge_config.sh -O . -m $COM $DEV
          
          # 修复NR_CPUS=8，解决tracepoint错误
          sed -i 's/CONFIG_NR_CPUS=.*/CONFIG_NR_CPUS=8/' .config

      - name: 2. 注入KSU依赖项
        run: |
          cd $GITHUB_WORKSPACE
          echo "CONFIG_KPROBES=y" >> .config
          echo "CONFIG_KALLSYMS_ALL=y" >> .config
          echo "CONFIG_MODULES=y" >> .config
          echo "CONFIG_MODULE_UNLOAD=y" >> .config
          echo "CONFIG_KSU=y" >> .config
          
          # 同步配置，解决依赖冲突
          make ARCH=arm64 olddefconfig

      - name: Integrate KernelSU 0.9.5
        run: |
          cd $GITHUB_WORKSPACE
          curl -LSs https://raw.githubusercontent.com/tiann/KernelSU/v0.9.5/kernel/setup.sh | bash -s v0.9.5

      - name: Build Kernel (完整日志)
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
        run: |
          cd $GITHUB_WORKSPACE
          make -j$(nproc) V=1

      - name: Move Kernel Image
        run: |
          cp arch/arm64/boot/Image.gz-dtb boot.img

      - name: Upload Boot Image
        uses: actions/upload-artifact@v4
        with:
          name: Mi8SE-Sirius-KSU095-Boot
          path: boot.img
