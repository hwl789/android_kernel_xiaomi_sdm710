name: Mi8SE/Rocky7842 + KernelSU 0.9.5 (手动补丁修复版)
on:
  workflow_dispatch:
  push:
    branches: [ lineage-23.0 ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: Rocky7842/android_kernel_xiaomi_sdm710
          ref: lineage-23.0
          fetch-depth: 1

      - name: Install Full Build Dependencies
        run: |
          sudo apt update && sudo apt upgrade -y
          sudo apt install -y \
            build-essential libssl-dev libelf-dev bc bison flex cpio zip unzip git \
            libc6-dev-i386 liblz4-tool lzop openssl \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu clang lld

      - name: 1. 拉取并添加 KernelSU 源码
        run: |
          cd $GITHUB_WORKSPACE
          curl -LSs https://github.com/tiann/KernelSU/archive/refs/tags/v0.9.5.tar.gz | tar -xz
          mv KernelSU-0.9.5/kernel ./KernelSU
          rm -rf KernelSU-0.9.5

      - name: 2. 修改内核根目录 Makefile 引入 KSU
        run: |
          cd $GITHUB_WORKSPACE
          sed -i '/core-y += kernel\/$/a core-y += KernelSU/' Makefile

      - name: 3. 修改 Kconfig 引入 KSU 配置
        run: |
          cd $GITHUB_WORKSPACE
          sed -i '/source "kernel\/Kconfig"/a source "KernelSU/Kconfig"' Kconfig

      - name: 4. 修改 init/main.c 添加 KSU 初始化
        run: |
          cd $GITHUB_WORKSPACE
          sed -i '/#include <linux\/sched.h>/a #include <linux\/ksu.h>' init/main.c
          sed -i '/do_basic_setup();/a \    ksu_init();' init/main.c

      - name: 5. 合并小米8 SE配置 + 修复NR_CPUS
        run: |
          cd $GITHUB_WORKSPACE
          COM=arch/arm64/configs/xiaomi/sdm710-common.config
          DEV=arch/arm64/configs/xiaomi/sirius.config
          
          ./scripts/kconfig/merge_config.sh -O . -m $COM $DEV
          sed -i 's/CONFIG_NR_CPUS=.*/CONFIG_NR_CPUS=8/' .config
          echo "# CONFIG_KPROBES is not set" >> .config

      - name: Build Kernel (Clang + LLD + 显式指定交叉编译器)
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
          CC: clang
          LD: ld.lld
        run: |
          cd $GITHUB_WORKSPACE
          make -j$(nproc) V=1
