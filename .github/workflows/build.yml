name: SDM710 Kernel + KernelSU 0.9.5

on:
  workflow_dispatch:
  push:
    branches: [ lineage-23.0 ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: lineage-23.0
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt update -y
          sudo apt install -y build-essential libssl-dev libelf-dev bc bison flex python3 zip unzip

      - name: Clone official LineageOS GCC 4.9 toolchain
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git toolchain

      - name: Apply KernelSU configs to sdm710_defconfig
        run: |
          cd $GITHUB_WORKSPACE
          DEFCONFIG=arch/arm64/configs/sdm710_defconfig
          # 修复NR_CPUS问题
          sed -i 's/CONFIG_NR_CPUS=.*/CONFIG_NR_CPUS=8/' $DEFCONFIG
          # 启用KSU必需配置
          sed -i 's/# CONFIG_KPROBES is not set/CONFIG_KPROBES=y/' $DEFCONFIG
          sed -i 's/# CONFIG_KALLSYMS_ALL is not set/CONFIG_KALLSYMS_ALL=y/' $DEFCONFIG
          sed -i 's/# CONFIG_MODULES is not set/CONFIG_MODULES=y/' $DEFCONFIG
          sed -i 's/# CONFIG_MODULE_UNLOAD is not set/CONFIG_MODULE_UNLOAD=y/' $DEFCONFIG

      - name: Integrate KernelSU 0.9.5
        run: |
          cd $GITHUB_WORKSPACE
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/v0.9.5/kernel/setup.sh" | bash -s v0.9.5

      - name: Build kernel
        env:
          PATH: ${{ github.workspace }}/toolchain/bin:$PATH
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-android-
        run: |
          cd $GITHUB_WORKSPACE
          make sdm710_defconfig
          make -j$(nproc)

      - name: Prepare boot.img
        run: |
          cp $GITHUB_WORKSPACE/arch/arm64/boot/Image.gz-dtb $GITHUB_WORKSPACE/boot.img

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdm710-boot-with-ksu095
          path: boot.img
