name: Build Kernel (Clang)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        repository: Rocky7842/android_kernel_xiaomi_sdm710
        ref: lineage-23.2-ksu
        fetch-depth: 1

    - name: Install deps
      run: |
        sudo apt update
        sudo apt install -y bc bison flex libssl-dev make clang lld llvm

    - name: Build
      run: |
        export ARCH=arm64
        export LLVM=1
        export CROSS_COMPILE=aarch64-linux-gnu-
        export LD=ld.lld
        make sdm710-common_defconfig
        make -j$(nproc) KCFLAGS="-Wno-error"

    - name: Upload kernel
      uses: actions/upload-artifact@v4
      with:
        name: kernel
        path: |
          arch/arm64/boot/Image
          arch/arm64/boot/Image.gz-dtb
