name: Build SDM710 Kernel (Sirius/小米8 SE) with KSU
on:
  workflow_dispatch:
  push:
    branches: [ lineage-23.2-ksu ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 1. 拉取内核源码
        uses: actions/checkout@v4
        with:
          repository: hwl789/android_kernel_xiaomi_sdm710
          ref: lineage-23.2-ksu
          submodules: recursive
          fetch-depth: 1

      - name: 2. 更换APT为清华源 + 安装基础依赖
        run: |
          sudo sed -i 's/archive.ubuntu.com/mirrors.tuna.tsinghua.edu.cn/g' /etc/apt/sources.list
          sudo sed -i 's/security.ubuntu.com/mirrors.tuna.tsinghua.edu.cn/g' /etc/apt/sources.list
          sudo apt update -y
          sudo apt install -y build-essential libssl-dev bc lz4 unzip curl python3 bison flex libelf-dev android-tools-mkbootimg

      - name: 3. 原生git拉取谷歌官方GCC4.9（无代理）
        run: |
          git clone https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 toolchain --depth=1
          echo "TOOLCHAIN=$GITHUB_WORKSPACE/toolchain/bin" >> $GITHUB_ENV

      - name: 4. 生成内核配置（标准defconfig语法，强制开启KSU）
        run: |
          # 标准安卓内核语法，ARCH自动匹配arch/arm64/configs/xiaomi/
          make ARCH=arm64 CROSS_COMPILE=${TOOLCHAIN}/aarch64-linux-android- sdm710-common
          make ARCH=arm64 CROSS_COMPILE=${TOOLCHAIN}/aarch64-linux-android- sirius
          
          echo -e "CONFIG_KPROBES=y\nCONFIG_KPROBE_EVENTS=y\nCONFIG_MODULES=y\nCONFIG_MODULE_UNLOAD=y\nCONFIG_KSU=y" >> .config
          grep -i "ksu\|kprobe" .config

      - name: 5. 编译内核
        env:
          ARCH: arm64
          CROSS_COMPILE: ${{ env.TOOLCHAIN }}/aarch64-linux-android-
        run: |
          make -j$(nproc) Image.gz-dtb modules

      - name: 6. 下载原厂boot.img
        run: |
          wget https://github.com/Rocky7842/android_kernel_xiaomi_sdm710/releases/download/lineage-23.2/stock_boot.img -O stock_boot.img

      - name: 7. 打包带KSU的boot.img
        run: |
          unpackbootimg -i stock_boot.img
          cp arch/arm64/boot/Image.gz-dtb stock_boot.img-zImage
          mkbootimg \
            --kernel stock_boot.img-zImage \
            --ramdisk stock_boot.img-ramdisk.gz \
            --cmdline "console=ttyMSM0,115200,n8 androidboot.console=ttyMSM0 androidboot.hardware=qcom androidboot.userdebug=true" \
            --base 0x80000000 \
            --pagesize 4096 \
            -o KSU_sirius_boot.img

      - name: 8. 上传成品
        uses: actions/upload-artifact@v4
        with:
          name: KSU‑Sirius‑Boot‑Image
          path: KSU_sirius_boot.img
