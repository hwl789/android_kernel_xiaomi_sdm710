name: Build Sirius KSU Kernel
on:
  push:
    branches: [ lineage-23.2-ksu ]
  workflow_dispatch: # 支持手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: Rocky7842/kernel_xiaomi_sirius
          ref: lineage-23.2-ksu
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          sudo apt update -y
          sudo apt install -y build-essential libssl-dev libelf-dev bzip2 zip unzip wget git

      - name: Download Clang Toolchain (匹配作者编译环境)
        run: |
          git clone https://github.com/LineageOS/android_prebuilts_clang_kernel.git clang
          export CLANG_PATH=$PWD/clang/bin
          echo "PATH=$CLANG_PATH:$PATH" >> $GITHUB_ENV

      - name: Build Kernel Image.gz-dtb
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=$PWD/clang/bin/aarch64-linux-gnu-
          make sirius_defconfig
          make -j$(nproc) CC=clang
        env:
          KBUILD_BUILD_USER: GitHub
          KBUILD_BUILD_HOST: Actions

      - name: Build boot.img (fastboot线刷包)
        run: |
          git clone https://github.com/osm0sis/mkbootimg.git
          cd mkbootimg && make && cd ..
          ./mkbootimg/mkbootimg \
            --kernel arch/arm64/boot/Image.gz-dtb \
            --base 0x00000000 \
            --kernel_offset 0x00008000 \
            --ramdisk_offset 0x01000000 \
            --tags_offset 0x00000100 \
            --pagesize 4096 \
            -o boot.img

      - name: Build AnyKernel3.zip (Rec卡刷包)
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git
          cp arch/arm64/boot/Image.gz-dtb AnyKernel3/zImage-dtb
          cd AnyKernel3
          zip -r ../AnyKernel3-sirius-ksu.zip *

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Sirius-KSU-Kernel
          paths: |
            boot.img
            AnyKernel3-sirius-ksu.zip
            arch/arm64/boot/Image.gz-dtb
