name: Xiaomi 8 SE Kernel + KernelSU 0.9.5

on:
  workflow_dispatch:
  push:
    branches: [ lineage-23.0 ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: lineage-23.0
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt update -y
          sudo apt install -y build-essential libssl-dev libelf-dev bc bison flex python3 zip unzip

      - name: Download Linaro GCC 7.5
        run: |
          wget https://releases.linaro.org/components/toolchain/binaries/latest-7/aarch64-linux-gnu/gcc-linaro-7.5.0-2019.12-x86_64_aarch64-linux-gnu.tar.xz
          tar -xf gcc-linaro-7.5.0-2019.12-x86_64_aarch64-linux-gnu.tar.xz
          echo "$PWD/gcc-linaro-7.5.0-2019.12-x86_64_aarch64-linux-gnu/bin" >> $GITHUB_PATH

      - name: List all defconfig files
        run: |
          cd $GITHUB_WORKSPACE
          echo "=== All defconfig files ==="
          ls -la arch/arm64/configs/

      - name: Find the correct defconfig for xmsirius
        id: find_defconfig
        run: |
          cd $GITHUB_WORKSPACE
          DEFCONFIG=$(find arch/arm64/configs -name "*sirius*" -o -name "*xmsirius*" | head -n 1)
          echo "defconfig=$DEFCONFIG" >> $GITHUB_OUTPUT
          echo "Found defconfig: $DEFCONFIG"
          if [ -z "$DEFCONFIG" ]; then
            echo "❌ No defconfig found!"
            exit 1
          fi

      - name: Apply KernelSU configs
        run: |
          cd $GITHUB_WORKSPACE
          DEFCONFIG=${{ steps.find_defconfig.outputs.defconfig }}
          echo "Patching $DEFCONFIG"
          sed -i 's/# CONFIG_KPROBES is not set/CONFIG_KPROBES=y/' $DEFCONFIG
          sed -i 's/# CONFIG_KALLSYMS_ALL is not set/CONFIG_KALLSYMS_ALL=y/' $DEFCONFIG
          sed -i 's/# CONFIG_MODULES is not set/CONFIG_MODULES=y/' $DEFCONFIG
          sed -i 's/# CONFIG_MODULE_UNLOAD is not set/CONFIG_MODULE_UNLOAD=y/' $DEFCONFIG

      - name: Integrate KernelSU 0.9.5
        run: |
          cd $GITHUB_WORKSPACE
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/v0.9.5/kernel/setup.sh" | bash -s v0.9.5

      - name: Build kernel
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
        run: |
          cd $GITHUB_WORKSPACE
          DEFCONFIG=${{ steps.find_defconfig.outputs.defconfig }}
          DEFCONFIG_NAME=$(basename $DEFCONFIG)
          echo "Building with defconfig: $DEFCONFIG_NAME"
          make $DEFCONFIG_NAME
          make -j$(nproc)

      - name: Prepare boot.img
        run: |
          cp $GITHUB_WORKSPACE/arch/arm64/boot/Image.gz-dtb $GITHUB_WORKSPACE/boot.img

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xmsirius-boot-with-ksu095
          path: boot.img
