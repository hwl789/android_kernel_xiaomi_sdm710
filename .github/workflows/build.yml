name: SDM710 Kernel + KernelSU 0.9.5

on:
  workflow_dispatch:
  push:
    branches: [ lineage-23.0 ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: lineage-23.0
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt update -y
          sudo apt install -y build-essential libssl-dev libelf-dev bc bison flex python3 zip unzip

      - name: Download Linaro GCC 7.5
        run: |
          wget https://releases.linaro.org/components/toolchain/binaries/latest-7/aarch64-linux-gnu/gcc-linaro-7.5.0-2019.12-x86_64_aarch64-linux-gnu.tar.xz
          tar -xf gcc-linaro-7.5.0-2019.12-x86_64_aarch64-linux-gnu.tar.xz
          echo "$PWD/gcc-linaro-7.5.0-2019.12-x86_64_aarch64-linux-gnu/bin" >> $GITHUB_PATH

      - name: Apply KernelSU configs to sdm710_defconfig
        run: |
          cd $GITHUB_WORKSPACE
          DEFCONFIG=arch/arm64/configs/sdm710_defconfig
          # 强制修改配置，不管文件是否存在注释
          echo "CONFIG_KPROBES=y" >> $DEFCONFIG
          echo "CONFIG_KALLSYMS_ALL=y" >> $DEFCONFIG
          echo "CONFIG_MODULES=y" >> $DEFCONFIG
          echo "CONFIG_MODULE_UNLOAD=y" >> $DEFCONFIG

      - name: Integrate KernelSU 0.9.5
        run: |
          cd $GITHUB_WORKSPACE
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/v0.9.5/kernel/setup.sh" | bash -s v0.9.5

      - name: Build kernel
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
        run: |
          cd $GITHUB_WORKSPACE
          make sdm710_defconfig
          make -j$(nproc)

      - name: Prepare boot.img
        run: |
          cp $GITHUB_WORKSPACE/arch/arm64/boot/Image.gz-dtb $GITHUB_WORKSPACE/boot.img

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdm710-boot-with-ksu095
          path: boot.img
