name: Build SDM710 Kernel (Sirius/小米8 SE) with KSU

on:
  workflow_dispatch:
  push:
    branches: [ lineage-23.2-ksu ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: 1. 拉取内核源码（含子模块）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: lineage-23.2-ksu
          submodules: recursive

      - name: 2. 安装编译依赖
        run: |
          sudo apt update -y
          sudo apt install -y \
            build-essential gcc-multilib g++-multilib \
            libssl-dev bc lz4 unzip curl python3 \
            android-sdk-libsparse-utils \
            bison flex libelf-dev \
            liblz4-tool

      - name: 3. 下载 GCC 4.9 工具链（清华源）
        run: |
          git clone --depth=1 \
            https://mirrors.tuna.tsinghua.edu.cn/git/AOSP/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
            toolchain
          echo "TOOLCHAIN=$GITHUB_WORKSPACE/toolchain/bin" >> $GITHUB_ENV

      - name: 4. 生成并配置内核（含 KSU）
        run: |
          set -e  # 遇到错误立即退出
          export ARCH=arm64
          export CROSS_COMPILE=$TOOLCHAIN/aarch64-linux-android-

          # 生成基础配置
          make arch/arm64/configs/xiaomi/sdm710-common.config
          # 合并 Sirius 设备配置
          make arch/arm64/configs/xiaomi/sirius.config

          # 启用 KSU 及相关依赖
          echo -e "\
CONFIG_KPROBES=y\n\
CONFIG_KPROBE_EVENTS=y\n\
CONFIG_MODULES=y\n\
CONFIG_MODULE_UNLOAD=y\n\
CONFIG_KSU=y\n\
" >> .config

          # 自动补齐缺失符号，避免编译报错
          make olddefconfig

      - name: 5. 编译内核
        env:
          ARCH: arm64
          CROSS_COMPILE: ${{ env.TOOLCHAIN }}/aarch64-linux-android-
        run: |
          set -e
          make -j$(nproc) Image.gz-dtb

      - name: 6. 下载原厂 boot.img
        run: |
          set -e
          wget -O stock_boot.img \
            https://github.com/Rocky7842/android_kernel_xiaomi_sdm710/releases/download/lineage-23.2/stock_boot.img

      - name: 7. 打包 KSU boot.img
        run: |
          set -e
          # 解析原厂 boot.img 信息
          unpackbootimg -i stock_boot.img
          
          # 复制新内核
          cp arch/arm64/boot/Image.gz-dtb stock_boot.img-zImage

          # 使用原厂参数打包（更安全）
          mkbootimg \
            --kernel stock_boot.img-zImage \
            --ramdisk stock_boot.img-ramdisk.gz \
            --cmdline "$(cat stock_boot.img-cmdline)" \
            --base $(cat stock_boot.img-base) \
            --pagesize $(cat stock_boot.img-pagesize) \
            --kernel_offset $(cat stock_boot.img-kernel_offset) \
            --ramdisk_offset $(cat stock_boot.img-ramdisk_offset) \
            --second_offset $(cat stock_boot.img-second_offset) \
            --tags_offset $(cat stock_boot.img-tags_offset) \
            -o KSU_sirius_boot.img

      - name: 8. 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: KSU-Sirius-Boot-Image
          path: KSU_sirius_boot.img
