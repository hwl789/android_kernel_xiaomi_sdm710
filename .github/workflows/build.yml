name: Mi8SE/Rocky7842 + KernelSU 0.9.5 (官方指南版)
on:
  workflow_dispatch:
  push:
    branches: [ lineage-23.0 ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: Rocky7842/android_kernel_xiaomi_sdm710
          ref: lineage-23.0
          fetch-depth: 1

      - name: Install Full Build Dependencies
        run: |
          sudo apt update && sudo apt upgrade -y
          sudo apt install -y \
            build-essential libssl-dev libelf-dev bc bison flex cpio zip unzip git \
            libc6-dev-i386 liblz4-tool lzop openssl \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu clang lld

      - name: 1. 生成基础配置 + 修复NR_CPUS
        run: |
          cd $GITHUB_WORKSPACE
          COM=arch/arm64/configs/xiaomi/sdm710-common.config
          DEV=arch/arm64/configs/xiaomi/sirius.config
          
          ./scripts/kconfig/merge_config.sh -O . -m $COM $DEV
          sed -i 's/CONFIG_NR_CPUS=.*/CONFIG_NR_CPUS=8/' .config

      - name: 2. 按官方指南注入KSU配置
        run: |
          cd $GITHUB_WORKSPACE
          echo "CONFIG_KALLSYMS=y" >> .config
          echo "CONFIG_KALLSYMS_ALL=y" >> .config
          echo "CONFIG_MODULES=y" >> .config
          echo "CONFIG_MODULE_UNLOAD=y" >> .config
          echo "CONFIG_KSU=y" >> .config
          # 官方推荐：非GKI内核如果kprobes有问题，开启这个选项
          echo "CONFIG_KSU_NO_KPROBES=y" >> .config
          
          make ARCH=arm64 olddefconfig

      - name: 3. 按官方指南集成KernelSU 0.9.5
        run: |
          cd $GITHUB_WORKSPACE
          curl -LSs https://raw.githubusercontent.com/tiann/KernelSU/v0.9.5/kernel/setup.sh | bash -s v0.9.5

      - name: 4. 禁用kprobes编译（彻底解决链接错误）
        run: |
          cd $GITHUB_WORKSPACE
          # 注释掉probes目录的编译指令，让构建脚本不进入该目录
          sed -i 's/obj-$(CONFIG_KPROBES)/# obj-$(CONFIG_KPROBES)/g' arch/arm64/kernel/Makefile
          # 清空probes目录的Makefile，防止生成built-in.o
          echo "# Probes module disabled" > arch/arm64/kernel/probes/Makefile
          echo "obj-y := " >> arch/arm64/kernel/probes/Makefile

      - name: Build Kernel (Clang + LLD)
        env:
          ARCH: arm64
          CC: clang
          CROSS_COMPILE: aarch64-linux-gnu-
          LD: ld.lld
        run: |
          cd $GITHUB_WORKSPACE
          make -j$(nproc) V=1

      - name: Move Kernel Image
        run: |
          cp arch/arm64/boot/Image.gz-dtb boot.img

      - name: Upload Boot Image
        uses: actions/upload-artifact@v4
        with:
          name: Mi8SE-Sirius-KSU095-Official-Boot
          path: boot.img
